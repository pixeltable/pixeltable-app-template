[project]
name = "video-search"
version = "0.1.0"
description = "Self-hosted video intelligence pipeline: frame extraction, transcription, object detection, and multi-modal search."
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.6.5",
    "sentence-transformers>=5.6.0",
    "open-clip-torch>=2.20",
    "transformers>=4.30",
    "timm>=0.9",
    "torch>=2.0",
    "pillow>=10.0",
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "psycopg[binary]>=3.1",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "functions"]
