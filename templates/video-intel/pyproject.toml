[project]
name = "video-intel"
version = "0.1.0"
description = "Self-hosted video intelligence pipeline — frame extraction, transcription, object detection, and multi-modal search."
requires-python = ">=3.10"
dependencies = [
    "pixeltable>=0.6.2",
    "sentence-transformers>=3.0",
    "open-clip-torch>=2.20",
    "transformers>=4.30",
    "torch>=2.0",
    "pillow>=10.0",
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "psycopg[binary]>=3.1",
    "openai-whisper>=20231117",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
detection = ["timm>=0.9"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["schema"]

# ── Pixeltable service config (read by `pxt serve`) ─────────────────────────
# Start the server:
#   pxt serve videointel
#   pxt serve videointel --port 9000

[[tool.pixeltable.service]]
name = "videointel"
prefix = "/api"
port = 8000

# ── Query routes ─────────────────────────────────────────────────────────────

[[tool.pixeltable.service.routes]]
type = "query"
path = "/search/visual"
query = "schema:search_visual"
method = "post"

[[tool.pixeltable.service.routes]]
type = "query"
path = "/search/spoken"
query = "schema:search_spoken"
method = "post"

[[tool.pixeltable.service.routes]]
type = "query"
path = "/search"
query = "schema:search_all"
method = "post"

[[tool.pixeltable.service.routes]]
type = "query"
path = "/search/objects"
query = "schema:search_objects"
method = "post"

# ── Insert routes ────────────────────────────────────────────────────────────

[[tool.pixeltable.service.routes]]
type = "insert"
path = "/ingest"
table = "videointel.videos"
uploadfile_inputs = ["video"]
inputs = ["title"]
outputs = ["uuid"]
