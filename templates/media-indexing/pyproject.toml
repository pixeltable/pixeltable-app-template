[project]
name = "media-indexing"
version = "0.1.0"
description = "Enterprise media processing pipeline: ingest, process, search across modalities"
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.6.5",
    "sentence-transformers>=5.6.0",
    "pillow>=10.0",
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "tiktoken>=0.7",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
cloud = ["boto3>=1.28"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "functions", "pipeline"]
