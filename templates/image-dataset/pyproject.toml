[project]
name = "image-dataset"
version = "0.1.0"
description = "ML dataset engineering: import, auto-annotate, curate, version, and export."
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.6.5",
    "open-clip-torch>=2.20",
    "transformers>=4.30",
    "torch>=2.0",
    "timm>=0.9",
    "pillow>=10.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
export = ["pyarrow>=12.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "export"]
