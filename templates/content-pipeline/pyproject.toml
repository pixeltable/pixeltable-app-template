[project]
name = "content-pipeline"
version = "0.1.0"
description = "Enterprise media processing pipeline -- ingest, process, search across modalities"
requires-python = ">=3.10"
dependencies = [
    "pixeltable>=0.6.2",
    "sentence-transformers>=3.0",
    "pillow>=10.0",
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "tiktoken>=0.7",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
cloud = ["boto3>=1.28"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["schema", "functions"]

[[tool.pixeltable.service]]
name = "pipeline"
modules = ["schema"]
prefix = "/api"
port = 8000

[[tool.pixeltable.service.routes]]
type = "query"
path = "/search"
query = "schema.search_documents"
method = "post"

[[tool.pixeltable.service.routes]]
type = "insert"
path = "/ingest/image"
table = "pipeline.images"
uploadfile_inputs = ["image"]
inputs = ["source_url"]
outputs = ["uuid"]

[[tool.pixeltable.service.routes]]
type = "insert"
path = "/ingest/document"
table = "pipeline.documents"
uploadfile_inputs = ["document"]
inputs = ["title"]
outputs = ["uuid"]

[[tool.pixeltable.service.routes]]
type = "insert"
path = "/ingest/audio"
table = "pipeline.audio_files"
uploadfile_inputs = ["audio"]
inputs = ["title"]
outputs = ["uuid"]
