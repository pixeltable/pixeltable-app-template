# Pixeltable service + deployment configuration.
#
# Local dev:   PYTHONPATH=. pxt serve openai_demo
# Deploy dev:  pxt deploy openai_demo_dev --org <your-org>
# Deploy prod: pxt deploy openai_demo_prod --org <your-org>

[[service]]
name    = "openai_demo"
modules = ["app"]

# Upload an image → returns job_url; poll job to get description.
[[service.routes]]
type              = "compute"
table             = "pipeline.images"
path              = "/image"
uploadfile_inputs = ["image"]
outputs           = ["description"]
background        = true

# Submit text → summary via gpt-4o-mini.
[[service.routes]]
type    = "compute"
table   = "pipeline.documents"
path    = "/document"
inputs  = ["body"]
outputs = ["summary"]

# Dev deployment: 1 worker, dev environment.
# Inherits OPENAI_API_KEY from org secrets.
# Override with a dev-specific key via: pxt environment add-secret dev OPENAI_API_KEY <dev-key>
[[deployment]]
name    = "openai_demo_dev"
service = "openai_demo"
env     = "dev"
workers = 1
exclude = ["__pycache__", "*.pyc", ".git", ".env", "*.egg-info", ".venv"]

# Staging deployment: 2 workers, staging environment.
# Inherits OPENAI_API_KEY from org secrets.
[[deployment]]
name    = "openai_demo_staging"
service = "openai_demo"
env     = "staging"
workers = 2
exclude = ["__pycache__", "*.pyc", ".git", ".env", "*.egg-info", ".venv"]

# Production deployment: 3 workers, production environment.
# Inherits OPENAI_API_KEY from org secrets (or production-level override if set).
[[deployment]]
name    = "openai_demo_production"
service = "openai_demo"
env     = "production"
workers = 3
exclude = ["__pycache__", "*.pyc", ".git", ".env", "*.egg-info", ".venv"]
