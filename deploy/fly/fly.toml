# Fly.io deployment config for the Pixeltable Starter Kit.
#
# First-time deploy:
#   1. Copy this file to the repo root: cp deploy/fly/fly.toml .
#   2. fly launch --no-deploy
#   3. fly volumes create pxt_data --size 10 --region iad
#   4. fly secrets set OPENAI_API_KEY=sk-... ANTHROPIC_API_KEY=sk-ant-...
#   5. fly deploy
#
# Subsequent deploys reattach to the same volume — Pixeltable data persists.

app = "pixeltable-starter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  PIXELTABLE_HOME = "/data/pixeltable"

[mounts]
  source = "pxt_data"
  destination = "/data/pixeltable"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/api/data/list/documents"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
