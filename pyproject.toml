[project]
name = "pixeltable-starter-kit"
version = "0.1.0"
description = "Production-ready starter kit demonstrating three ways to deploy Pixeltable"
requires-python = ">=3.10"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.13",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "slow: schema import smoke tests requiring Pixeltable (pass --run-slow)",
]
xfail_strict = true
junit_family = "xunit2"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
