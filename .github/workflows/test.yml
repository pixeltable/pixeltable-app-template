name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check serving/ batch/ examples/ tests/
          uv run ruff format serving/ batch/ examples/ tests/ --check
      - name: Test
        run: uv run python -m pytest tests/ -v --tb=short

  schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install pattern dependencies
        run: |
          cd serving && uv sync
          cd ../batch && uv sync
      - name: Run schema import smoke tests
        run: uv run python -m pytest tests/test_schema.py -v --run-slow --tb=short

  app-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install pattern dependencies
        run: |
          cd serving && uv sync
          cd ../batch && uv sync
      - name: Verify serving and batch
        run: |
          set -euo pipefail
          PORT=18100
          RESULTS=()
          PID=""

          cleanup_server() {
            if [[ -n "${PID:-}" ]] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            PID=""
          }
          trap cleanup_server EXIT

          stop_postgres() {
            cleanup_server
            pkill -f pixeltable_pgserver 2>/dev/null || true
            pkill -f "pginstall/bin/postgres" 2>/dev/null || true
            sleep 3
          }

          wait_for_url() {
            local url=$1
            local tries=${2:-180}
            for _ in $(seq 1 "$tries"); do
              if curl -sf "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          stop_postgres
          echo "=== serving ==="
          SERVING_HOME="/tmp/pxt-app-verify-serving"
          rm -rf "$SERVING_HOME"
          (
            cd "$GITHUB_WORKSPACE/serving"
            export PIXELTABLE_HOME="$SERVING_HOME"
            uv run pxt schema update app.py pipeline -f
            uv run pxt service run app.py pipeline --host 127.0.0.1 --port "$PORT"
          ) >"/tmp/pxt-app-verify-serving.log" 2>&1 &
          PID=$!
          if wait_for_url "http://127.0.0.1:${PORT}/openapi.json" 180; then
            echo "OK  serving"
            RESULTS+=("OK  serving")
          else
            echo "FAIL serving"
            tail -25 "/tmp/pxt-app-verify-serving.log" || true
            RESULTS+=("FAIL serving")
          fi
          stop_postgres

          echo "=== batch ==="
          BATCH_HOME="/tmp/pxt-app-verify-batch"
          rm -rf "$BATCH_HOME"
          if (
            cd "$GITHUB_WORKSPACE/batch"
            export PIXELTABLE_HOME="$BATCH_HOME"
            export SERVING_DB_URL="sqlite:///${BATCH_HOME}/serving.db"
            uv run pxt schema update app.py pipeline -f
            uv run python pipeline.py
          ) >"/tmp/pxt-app-verify-batch.log" 2>&1; then
            echo "OK  batch"
            RESULTS+=("OK  batch")
          else
            echo "FAIL batch"
            tail -20 "/tmp/pxt-app-verify-batch.log" || true
            RESULTS+=("FAIL batch")
          fi
          stop_postgres

          echo "========== SUMMARY =========="
          printf '%s\n' "${RESULTS[@]}"
          if printf '%s\n' "${RESULTS[@]}" | grep -q '^FAIL'; then
            exit 1
          fi
