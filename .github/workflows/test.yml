name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check video-search/ chat-agent/ tests/
          uv run ruff format video-search/ chat-agent/ tests/ --check
      - name: Test
        run: uv run python -m pytest tests/ -v --tb=short

  schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install app dependencies
        run: |
          cd chat-agent && uv sync
          cd ../video-search && uv sync
      - name: Run schema import smoke tests
        run: uv run python -m pytest tests/test_schema.py -v --run-slow --tb=short

  app-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install app dependencies
        run: |
          cd chat-agent && uv sync
          cd ../video-search && uv sync
      - name: Verify chat-agent HTTP
        run: |
          set -euo pipefail
          PORT=18100
          RESULTS=()
          PID=""

          cleanup_server() {
            if [[ -n "${PID:-}" ]] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            PID=""
          }
          trap cleanup_server EXIT

          stop_postgres() {
            cleanup_server
            pkill -f pixeltable_pgserver 2>/dev/null || true
            pkill -f "pginstall/bin/postgres" 2>/dev/null || true
            sleep 3
          }

          wait_for_url() {
            local url=$1
            local tries=${2:-180}
            for _ in $(seq 1 "$tries"); do
              if curl -sf "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          stop_postgres
          echo "=== chat-agent ==="
          AGENT_HOME="/tmp/pxt-app-verify-chat-agent"
          rm -rf "$AGENT_HOME"
          (
            cd "$GITHUB_WORKSPACE/chat-agent"
            export PIXELTABLE_HOME="$AGENT_HOME"
            uv run pxt schema update app.py agent -f
            uv run pxt service run app.py agent --host 127.0.0.1 --port "$PORT"
          ) >"/tmp/pxt-app-verify-chat-agent.log" 2>&1 &
          PID=$!
          if wait_for_url "http://127.0.0.1:${PORT}/openapi.json" 180; then
            if curl -sf -X POST "http://127.0.0.1:${PORT}/api/knowledge" \
              -H "Content-Type: application/json" \
              -d '{"body": "One application file. Insert runs compute.", "title": "intro", "source": "docs"}' \
              >/dev/null; then
              echo "OK  chat-agent"
              RESULTS+=("OK  chat-agent")
            else
              echo "FAIL chat-agent (knowledge insert)"
              tail -25 "/tmp/pxt-app-verify-chat-agent.log" || true
              RESULTS+=("FAIL chat-agent")
            fi
          else
            echo "FAIL chat-agent"
            tail -25 "/tmp/pxt-app-verify-chat-agent.log" || true
            RESULTS+=("FAIL chat-agent")
          fi
          stop_postgres

          echo "=== video-search ==="
          CLIP="${VIDEO_CLIP:-}"
          if [[ -z "$CLIP" || ! -f "$CLIP" ]]; then
            echo "SKIP video-search (no clip)"
            RESULTS+=("SKIP video-search")
          else
            VIDEO_HOME="/tmp/pxt-app-verify-video-search"
            rm -rf "$VIDEO_HOME"
            (
              cd "$GITHUB_WORKSPACE/video-search"
              export PIXELTABLE_HOME="$VIDEO_HOME"
              uv run pxt schema update app.py videointel -f
              uv run pxt service run app.py videointel --host 127.0.0.1 --port "$PORT"
            ) >"/tmp/pxt-app-verify-video-search.log" 2>&1 &
            PID=$!
            if wait_for_url "http://127.0.0.1:${PORT}/openapi.json" 180; then
              echo "OK  video-search"
              RESULTS+=("OK  video-search")
            else
              echo "FAIL video-search"
              tail -25 "/tmp/pxt-app-verify-video-search.log" || true
              RESULTS+=("FAIL video-search")
            fi
            stop_postgres
          fi

          echo "========== SUMMARY =========="
          printf '%s\n' "${RESULTS[@]}"
          if printf '%s\n' "${RESULTS[@]}" | grep -q '^FAIL'; then
            exit 1
          fi
