      SERVING_DB_URL: "sqlite:///output/serving.db"
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # MEDIA_DEST: s3://your-bucket/output
    volumes:
      - output:/app/output
    # Override to pass custom args:
    # command: ["--input", "sample_batch.json"]

volumes:
  output:
