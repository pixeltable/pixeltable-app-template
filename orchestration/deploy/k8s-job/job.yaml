apiVersion: batch/v1
kind: Job
metadata:
  name: pixeltable-pipeline
  labels:
    app: pixeltable-pipeline
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: pixeltable-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: pipeline
          image: pixeltable-pipeline:latest
          env:
            - name: PIXELTABLE_HOME
              value: /tmp/pixeltable
            - name: SERVING_DB_URL
              valueFrom:
                secretKeyRef:
                  name: pixeltable-pipeline-secrets
                  key: serving-db-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pixeltable-pipeline-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: pixeltable-pipeline-secrets
type: Opaque
stringData:
  serving-db-url: "sqlite:///output/serving.db"
  openai-api-key: ""
